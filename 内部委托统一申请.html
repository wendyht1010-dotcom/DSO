<body>
<div class="app"><header class="topbar"><div class="brand">大洋集团</div><div class="crumb">操作单　/　内部委托</div><div class="user">Mason　⌄</div></header><main class="workspace"><div class="pagehead"><div><h1>操作单详情</h1><p>委托订舱及服务申请</p></div><button class="ghost" id="openModal">＋ 申请内部委托</button></div><div class="underlay"><div class="underlay-head"><span>委托订舱</span><span style="color:#718195;font-weight:400">服务申请集中在一个入口</span></div><table class="table"><thead><tr><th>序号</th><th>委托单号</th><th>服务类型</th><th>预计开始时间</th><th>委托状态</th><th>操作</th></tr></thead><tbody><tr><td colspan="6" style="text-align:center;padding:26px;color:#9aa8b6">暂无委托记录　·　点击右上角申请内部委托</td></tr></tbody></table></div></main></div>

<section class="section"><div class="section-title">委托基本信息 <small>来自当前操作单的内容自动带入</small></div><div class="form-grid">

</div></section>
<section class="section"><div class="section-title"><span id="serviceSectionTitle">端服务信息</span><small id="serviceSectionHint">按申请服务显示字段</small></div><div class="service-detail" id="serviceDetail"></div></section>

<script>
const services={
 DTHC:{summary:'固定出口业务 · 需填写柜型、柜量及清关地/报关地。',fields:[['品名','text'],['货物大类','select'],['柜型','select'],['柜量','number'],['清关地/报关地','select'],['清关类型','select']]},
 清关:{summary:'独立清关服务 · 从原端服务中拆出，清关地字段沿用统一口径。',fields:[['品名','text'],['货物大类','select'],['清关地/报关地','select'],['货物类型','select'],['HS编码','text'],['是否需要代办证书','yesno']]},
 派送:{summary:'派送子项五选一。按所选运输场景显示柜型或散货明细。',fields:[['服务子项','subtype']]}
};
const subtypes=['FCL提货','FCL派送','FCL转关派送','LCL派送','LCL转关派送'];let current='派送',currentSub='FCL提货',orderType='端服务',selectedServices={DTHC:false,派送:false},fclItems=[],lclItems=[],fclConfig={qty:1,type:'40HQ'};
const serviceFields={
'FCL提货':[['品名','text'],['货物大类','select'],['头程运输方式','select'],['预计服务开始时间','date'],['柜型','select'],['柜量','number'],['清关地/报关地','select'],['提货地址','text'],['提空地址','text'],['还重地址','text']],
'FCL派送':[['品名','text'],['货物大类','select'],['头程运输方式','select'],['预计服务开始时间','date'],['柜型','select'],['柜量','number'],['清关地/报关地','select'],['提重地点','text'],['送货地址','text'],['还空地址','text']],
'FCL转关派送':[['品名','text'],['货物大类','select'],['头程运输方式','select'],['预计服务开始时间','date'],['柜型','select'],['柜量','number'],['提重地点','text'],['清关地代码（海关编码）','text'],['清关地地址','text'],['送货地址','text'],['还空地址','text'],['HS编码','text']],
'LCL派送':[['品名','text'],['货物大类','select'],['头程运输方式','select'],['预计服务开始时间','date'],['提货地址','text'],['送货地址','text'],['HS编码','text']],
'LCL转关派送':[['品名','text'],['货物大类','select'],['头程运输方式','select'],['预计服务开始时间','date'],['提货地址','text'],['清关地代码（海关编码）','text'],['清关地地址','text'],['送货地址','text'],['HS编码','text']]
};
const options={select:['车站','机场','港口','城市'],yesno:['是','否']};
function inputField(name,type){let id='f_'+name.replace(/[^\w\u4e00-\u9fa5]/g,'');let el;if(name==='服务开始地'||name==='清关地/报关地'){el=`<input id="${id}" class="location-picker-trigger" data-location-field="${name}" placeholder="请选择${name}" readonly>`}else if(type==='select'){let vals=name==='货物大类'?['请选择','电子产品','机械设备','日用品','汽车配件','其他']:name==='柜型'?['请选择','20GP','40GP','40HQ','45HQ','其他']:name==='货物类型'?['请选择','集装箱','LCL']:name==='包装形式'?['请选择','纸箱','托盘','木箱','编织袋','吨袋','桶装','散装','其他']:name==='头程运输方式'?['请选择','铁路','海运','空运','公路']:name==='业务性质'?['请选择','出口','进口']:['请选择',...(options.select||[])];el=`<select id="${id}">${vals.map(v=>`<option>${v}</option>`).join('')}</select>`}else if(type==='yesno'){el=`<select id="${id}"><option>请选择</option><option>是</option><option>否</option></select>`}else el=`<input id="${id}" type="${type==='number'?'number':type==='date'?'date':'text'}" ${type==='number'?'min="1" step="1" '+(name==='柜量'?'value="1"':''):''} placeholder="${type==='number'?'请输入数量':'请输入'+name}">`;return `<div class="field"><label><i class="req">*</i> ${name}</label>${el}</div>`}

function captureCargoRows(){const q=document.getElementById('f_柜量'),t=document.getElementById('f_柜型');if(q)fclConfig.qty=parseInt(q.value)||0;if(t)fclConfig.type=t.value||fclConfig.type;document.querySelectorAll('#fclCargoRows .fcl-item').forEach((r,i)=>{fclItems[i]={no:r.querySelector('.container-no').value,type:r.querySelector('.container-type').value,weight:r.querySelector('.container-weight').value,hs:r.querySelector('.hs-count').value}});document.querySelectorAll('#cargoItems .cargo-item').forEach((r,i)=>{lclItems[i]={qty:r.querySelector('.qty').value,packing:r.querySelector('.packing').value,dimensions:r.querySelector('.dimensions').value,weight:r.querySelector('.unit-weight').value,stack:r.querySelector('.stackable').value}})}
