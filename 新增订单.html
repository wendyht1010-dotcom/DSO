<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>新增订单 | 大洋集团智慧物流</title><style>
:root{--blue:#3989ed;--ink:#172333;--line:#e4e9f0;--bg:#f2f5f9;--nav:#15283d;--muted:#8793a3}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:14px "Microsoft YaHei",Arial,sans-serif;color:var(--ink)}button,input,select{font:inherit}.sidebar{position:fixed;inset:0 auto 0 0;width:180px;background:var(--nav);color:#c4d0dd}.brand{height:52px;padding:0 20px;display:flex;align-items:center;color:white;font-weight:600;border-bottom:1px solid #ffffff12}.mark{display:grid;place-items:center;background:#3989ed;border-radius:6px;width:25px;height:25px;margin-right:10px}.nav-item{height:38px;padding:0 17px;display:flex;align-items:center;gap:11px;color:#b9c5d2;font-size:13px;text-decoration:none}.nav-item.section{color:#eef3f8;font-weight:600}.nav-item.active{background:#244563;color:white;border-left:3px solid #4a9bff;padding-left:14px}.nav-label{font-size:11px;color:#71869c;padding:20px 18px 7px}.main{margin-left:180px}.top{height:54px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 24px;gap:18px}.crumb{color:#8390a1}.crumb b{color:#26384c}.user{margin-left:auto;color:#728093}.content{padding:20px 24px 80px;max-width:1500px;margin:auto}.title{font-size:20px;font-weight:650}.subtitle{font-size:12px;color:#96a1af;margin-top:5px}.card{background:#fff;border:1px solid var(--line);border-radius:6px;box-shadow:0 2px 7px #1934530b;margin-top:18px}.card-head{background:#f5f7f9;border-bottom:1px solid var(--line);padding:12px 16px;font-weight:600;color:#394b5f}.card-body{padding:22px 18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 12px;max-width:1000px;margin:auto}.field{display:grid;grid-template-columns:130px minmax(180px,1fr);align-items:center}.field label{text-align:right;padding-right:12px;font-size:13px;color:#536174}.req:before{content:'* ';color:#e45151}.control{height:34px;border:1px solid #dce3eb;border-radius:4px;padding:6px 10px;color:#283b52;outline:none;min-width:0}.control:focus{border-color:#73adf3;box-shadow:0 0 0 2px #3989ed18}.select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,#8c9bad 50%),linear-gradient(135deg,#8c9bad 50%,transparent 50%);background-position:calc(100% - 15px) 14px,calc(100% - 10px) 14px;background-size:5px 5px;background-repeat:no-repeat;padding-right:28px}.hint{font-size:12px;color:#98a4b1;margin:18px auto 0;max-width:850px}.footer{position:fixed;bottom:0;left:180px;right:0;height:58px;background:white;border-top:1px solid var(--line);display:flex;justify-content:center;align-items:center;gap:10px}.btn{border:1px solid #d7e0e9;background:white;color:#516174;border-radius:4px;padding:8px 18px;cursor:pointer}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.btn.danger{background:#f26868;border-color:#f26868;color:#fff}.toast{position:fixed;right:28px;top:70px;background:#20344a;color:#fff;padding:11px 17px;border-radius:5px;opacity:0;transition:.2s}.toast.show{opacity:1}@media(max-width:950px){.grid{grid-template-columns:1fr}.sidebar{width:160px}.main{margin-left:160px}.footer{left:160px}}
a.nav-item{color:inherit;text-decoration:none}.nav-item.branch{padding-left:39px}.nav-item.leaf{padding-left:58px;font-size:12px;color:#aebdcb}</style></head><body><aside class="sidebar"><div class="brand"><span class="brand-mark">N</span>大洋集团</div><div class="nav-label">业务工作台</div><a class="nav-item" href="订单详情.html">⌂　工作台</a><div class="nav-item section">▦　综合订单</div><a class="nav-item branch active" href="新增订单.html">新增订单</a><a class="nav-item leaf" href="订单详情.html">订单详情页</a><div class="nav-item section">▦　各操作单</div><a class="nav-item branch" href="操作单详情.html" data-page="operation-detail">操作单详情</a><div class="nav-item section">▦　纯端服务业务</div><a class="nav-item branch" href="纯端服务业务.html#allocation" data-service-view="allocation">分配操作</a><a class="nav-item branch" href="纯端服务业务.html#end-service" data-service-view="end-service">端服务操作单</a><a class="nav-item leaf" href="纯端服务业务.html#detail" data-service-view="detail">端服务操作单详情</a><div class="nav-item section">▦　通用订单</div><a class="nav-item branch menu-screen-link" href="操作单详情.html?screen=internal-orders" data-screen="internal-orders">内部委托订单</a><a class="nav-item leaf menu-screen-link" href="操作单详情.html?screen=internal-mail" data-screen="internal-mail">邮件说明</a><a class="nav-item branch menu-screen-link" href="操作单详情.html?screen=operation-orders" data-screen="operation-orders">内部委托操作单</a><a class="nav-item leaf menu-screen-link" href="操作单详情.html?screen=operation-detail" data-screen="operation-detail">内部委托操作单详情</a><a class="nav-item branch menu-screen-link" href="操作单详情.html?screen=change-detail" data-screen="change-detail">变更申请详情</a><a class="nav-item leaf menu-screen-link" href="操作单详情.html?screen=change-mail" data-screen="change-mail">邮件说明</a></aside><main class="main"><header class="top"><span style="font-size:20px;color:#546375">☰</span><span class="crumb">订单管理　›　<b>新增订单</b></span><span class="user">中文 / EN　♧ 通知　大洋集团　|　Mason</span></header><div class="content"><div class="title">新增订单</div><div class="subtitle">填写下单要素后保存，进入订单详情补充完整信息</div><section class="card"><div class="card-head">新增订单</div><div class="card-body"><form id="newOrder" class="grid">
<div class="field"><label class="req" for="business">所属业务</label><select class="control select" id="business" required><option value="纯境外端服务" selected>纯境外端服务</option><option>综合物流</option><option>纯铁运服务</option></select></div>
<div class="field"><label class="req" for="nature">业务性质</label><select class="control select" id="nature" required><option value="出口" selected>出口</option><option value="进口">进口</option></select></div>
<div class="field"><label class="req" for="client">委托人</label><input class="control" id="client" list="clients" required><datalist id="clients"><option value="Moscow Global Logistics"></datalist></div>
<div class="field"><label class="req" for="type">业务类型</label><select class="control select" id="type" required><option value="自营" selected>自营</option><option>代理</option></select></div>
<div class="field"><label for="goods">货物简称</label><input class="control" id="goods" placeholder="请输入货物简称"></div>
<div class="field"><label for="origin">起运地</label><input class="control" id="origin" placeholder="请选择起运地"></div>
<div class="field"><label for="destination">目的地</label><input class="control" id="destination" placeholder="请选择目的地"></div>
<div class="field"><label for="packing">装箱方式</label><select class="control select" id="packing"><option value="整柜" selected>整柜</option><option>拼箱</option></select></div>
</form><div class="hint">保存后将跳转到订单详情页；可继续填写服务、线路、货物和业务备注等信息。</div></div></section></div><footer class="footer"><button class="btn primary" form="newOrder" type="submit">保存并进入订单详情</button><button class="btn danger" type="button" onclick="location.href='订单详情.html'">放弃</button></footer><div class="toast" id="toast"></div></main><script>
document.getElementById('newOrder').addEventListener('submit',e=>{e.preventDefault();if(!e.currentTarget.reportValidity())return;const data={business:document.getElementById('business').value,nature:document.getElementById('nature').value,client:document.getElementById('client').value,type:document.getElementById('type').value,goods:document.getElementById('goods').value,origin:document.getElementById('origin').value,destination:document.getElementById('destination').value,packing:document.getElementById('packing').value};try{sessionStorage.setItem('newOrderDraft',JSON.stringify(data))}catch(_){ }const params=new URLSearchParams({created:'1',...data});location.href='订单详情.html?'+params.toString()});
</script></body></html>
